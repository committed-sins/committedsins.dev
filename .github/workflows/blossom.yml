name: Build for Blossom

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blossom-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build Astro
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.html
          test -s dist/imprint/index.html
          tar -C dist -czf site.tar.gz .
          sha256sum site.tar.gz | cut -d ' ' -f 1 > site.sha256
      - name: Publish the build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="blossom-$GITHUB_SHA"
          if release=$(gh release view "$tag" --json isDraft,assets); then
            if jq -e '.isDraft' <<< "$release" > /dev/null; then
              gh release upload "$tag" site.tar.gz site.sha256 --clobber
              gh release edit "$tag" --draft=false
              exit
            fi
            jq -e '([.assets[].name] | sort) == ["site.sha256", "site.tar.gz"]' <<< "$release" > /dev/null
            exit
          fi
          gh release create "$tag" site.tar.gz site.sha256 \
            --target "$GITHUB_SHA" --title "Blossom build ${GITHUB_SHA:0:12}" \
            --notes "Static Astro build for commit $GITHUB_SHA." --prerelease --latest=false
