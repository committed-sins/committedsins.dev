# Checks pull requests and `main`: the site builds and the Blossom Caddyfile
# is valid. Deploying happens only through a release (release.yml).
name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Build Astro
        env:
          SITE_VERSION: v0.0.0-check
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile
          pnpm build
          test -s dist/index.html
          grep -qF '/releases/tag/v0.0.0-check"' dist/index.html
      - name: Validate the Caddyfile
        run: |
          image=$(sed -n 's/^ *image: *\(caddy:.*\)$/\1/p' deploy/blossom/compose.yaml | head -n 1)
          test -n "$image"
          docker run --rm -v "$PWD/deploy/blossom/Caddyfile:/etc/caddy/Caddyfile:ro" "$image" \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
